name: Safety and regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  agent-and-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: cargo fmt --all --check
      - run: cargo test -p zte-agent -p process-runner --locked
      - run: cargo clippy -p zte-agent -p process-runner --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check-api-contract.py
      - run: python3 scripts/check-device-secrets.py
      - run: python3 scripts/check-release.py
        env:
          RELEASE_SOURCE_REF: ${{ inputs.source_ref || github.ref }}
      - run: npm ci && npm run build && npm run lint && npm test
        working-directory: web-app
      - run: |
          for script in setup.sh deploy.sh deploy-dashboard.sh scripts/zharden.sh scripts/build-offline-bundle.sh scripts/device/*.sh; do
            bash -n "$script"
          done
  # The one-click update (deploy-windows.cmd) on Windows: real pipes, ssh.exe and PowerShell 5.1.
  windows-deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Deployment tool on Windows
        run: python -m unittest discover -s tests -p test_deploy_portability.py -v
      - name: deploy.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\windows\deploy.ps1", [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
          if ((Get-Help .\scripts\windows\deploy.ps1).Synopsis -notlike 'Updates a modem*') { Write-Error 'Script help is not recognised'; exit 1 }
          # Without release files it must stop after finding Python and ssh, before any network or modem access.
          New-Item -ItemType Directory empty-release | Out-Null
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\deploy.ps1 -AssetsDir empty-release -Yes *>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 1 -or $output -notmatch 'Python: ' -or $output -notmatch 'sha256sums.txt is missing') { Write-Error 'Unexpected result without release files'; exit 1 }
          exit 0
  native-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: installer
      - name: Fetch native installer resources
        shell: bash
        env:
          PLATFORM_TOOLS: ${{ runner.os == 'macOS' && 'darwin' || 'windows' }}
        run: |
          python scripts/prepare-installer-tools.py "$PLATFORM_TOOLS"
      - run: cargo test -p mu5250-installer -p process-runner --locked
      - run: cargo clippy -p mu5250-installer -p process-runner --all-targets --locked -- -D warnings

name: mihomo core
on:
  push:
    branches: [main]
    paths:
      - scripts/prepare-mihomo.py
      - scripts/prepare-geodata.py
      - scripts/mihomo-patches/**
      - tests/mihomo/**
      - tests/clash-netns.sh
      - agent/src/clash*.rs
      - agent/src/egress.rs
      - .github/workflows/mihomo.yml
  pull_request:
    paths:
      - scripts/prepare-mihomo.py
      - scripts/prepare-geodata.py
      - scripts/mihomo-patches/**
      - tests/mihomo/**
      - tests/clash-netns.sh
      - agent/src/clash*.rs
      - agent/src/egress.rs
      - .github/workflows/mihomo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned mihomo (checksum-verified)
        run: python3 scripts/prepare-mihomo.py --docker --output build/mihomo/mihomo
      - name: Smoke test under qemu
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          qemu-aarch64 build/mihomo/mihomo -v | tee /dev/stderr | grep 'linux arm64' | grep -qF "$(python3 -c 'import runpy; print(runpy.run_path("scripts/prepare-mihomo.py")["VERSION"])')"
          mkdir -p build/smoke && cp tests/mihomo/smoke.yaml build/smoke/config.yaml
          qemu-aarch64 build/mihomo/mihomo -d build/smoke -t -f build/smoke/config.yaml
      - name: Bundled geo data loads offline through home symlinks
        run: |
          python3 scripts/prepare-geodata.py --output build/geo
          mkdir -p build/geo-home && cp tests/mihomo/geo.yaml build/geo-home/config.yaml
          ln -s "$PWD/build/geo/geoip.metadb" "$PWD/build/geo/GeoSite.dat" build/geo-home/
          sudo unshare -n qemu-aarch64 build/mihomo/mihomo -d build/geo-home -t -f build/geo-home/config.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Data path in network namespaces (agent policies + real core)
        run: |
          sudo apt-get install -y -qq bind9-dnsutils
          OPENUI_CLASH_TEST_POLICIES=/tmp/openui-clash-check cargo test -q -p zte-agent --locked clash::tests::export
          cp build/mihomo/mihomo /tmp/openui-clash-check/
          sudo BASE=/tmp/openui-clash-check MIHOMO_RUNNER=qemu-aarch64 sh tests/clash-netns.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mihomo-linux-arm64
          path: build/mihomo/
          retention-days: 30
